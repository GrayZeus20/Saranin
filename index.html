<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets the page paint under the notch / home indicator;
       the .safe-* helpers in index.css pad content back out of those insets. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SARANIN.</title>
  <meta name="description" content="Discover trending movies, popular TV shows, and anime." />
  <!-- Open Graph / Twitter — static defaults; per-route titles are set at runtime. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SARANIN." />
  <meta property="og:title" content="SARANIN. — Discover movies, TV shows & anime" />
  <meta property="og:description" content="Trending movies, popular TV shows, and anime — with a watchlist for what to watch next." />
  <meta property="og:image" content="/favicon.svg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="SARANIN. — Discover movies, TV shows & anime" />
  <meta name="twitter:description" content="Trending movies, popular TV shows, and anime — with a watchlist for what to watch next." />
  <meta name="twitter:image" content="/favicon.svg" />
  <!-- Must stay equal to --color-surface in src/index.css, so the Android status
       bar does not flash a different shade than the app chrome. -->
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
