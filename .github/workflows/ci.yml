name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Headless-Chromium drag test for the ScrollRow rail. ubuntu-latest ships
      # google-chrome-stable, which scripts/dragtest/cdp.mjs finds via its
      # Linux candidates. Sandbox flags are handled inside the test.
      - run: npm run test:drag
